<!DOCTYPE html>
<html lang="ca" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Price Comparator</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Syne (display) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
    rel="stylesheet" />

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            body: ['DM Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf6',
              100: '#dcfce9',
              200: '#bbf7d2',
              300: '#86efb0',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            },
            ink: {
              DEFAULT: '#0d1117',
              soft: '#1c2333',
              muted: '#3a4455',
            },
            surface: {
              DEFAULT: '#f8fafc',
              card: '#ffffff',
              dark: '#111827',
            }
          },
          boxShadow: {
            'glow-green': '0 0 32px 4px rgba(34,197,94,0.18)',
            'card': '0 2px 20px 0 rgba(0,0,0,0.07)',
          }
        }
      }
    }
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase CDN (base de dades) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- PWA: Manifest + Service Worker -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SmartPrice" />
  <link rel="apple-touch-icon" href="icon-192.png" />
</head>

<body>

  <!-- ══════════════════════════════════════════════
       NAVBAR — Fixed, glass, responsive
  ════════════════════════════════════════════════ -->
  <nav class="nav-glass fixed top-0 left-0 right-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16">

        <!-- Logo -->
        <button onclick="showView('inici')" class="flex items-center gap-2 group">
          <div
            class="w-8 h-8 rounded-xl bg-brand-500 flex items-center justify-center shadow-glow-green group-hover:scale-105 transition-transform">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M3 12 L8 4 L13 12" stroke="white" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
              <path d="M5.5 9 h5" stroke="white" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </div>
          <span class="font-display font-800 text-base text-ink leading-none">Smart<span
              class="text-brand-500">Price</span></span>
        </button>

        <!-- Desktop nav links -->
        <div class="hidden lg:flex items-center gap-0">
          <button class="nav-link active" id="nav-inici" onclick="showView('inici')">Inici</button>
          <button class="nav-link" id="nav-pressupost" onclick="showView('pressupost')">Pressupost</button>
          <button class="nav-link" id="nav-metes" onclick="showView('metes')">Metes</button>
          <button class="nav-link" id="nav-dashboard" onclick="showView('dashboard')">Dashboard</button>
          <button class="nav-link" id="nav-historial" onclick="showView('historial')">Historial</button>
          <button class="nav-link" id="nav-comparador" onclick="showView('comparador')">Comparador</button>
          <button class="nav-link" id="nav-assessor" onclick="showView('assessor')">Assessor IA</button>
          <button class="nav-link" id="nav-compte" onclick="showView('compte')">El meu Compte</button>
        </div>

        <!-- CTA desktop -->
        <div class="hidden lg:flex items-center gap-3" id="auth-desktop">
          <button onclick="showView('login')"
            class="font-display font-600 text-sm text-ink-muted hover:text-ink transition-colors px-3 py-1.5">Entrar</button>
          <button onclick="showView('register')"
            class="font-display font-700 text-sm text-white bg-brand-500 hover:bg-brand-600 px-4 py-2 rounded-full shadow-glow-green transition-all hover:scale-105">
            Registra't gratis
          </button>
        </div>

        <!-- Hamburger (mobile/tablet) -->
        <button id="hamburger" onclick="toggleMenu()"
          class="lg:hidden p-2 rounded-lg text-ink-muted hover:text-ink hover:bg-brand-50 transition-colors"
          aria-label="Menú">
          <i data-lucide="menu" class="w-5 h-5" id="icon-open"></i>
          <i data-lucide="x" class="w-5 h-5 hidden" id="icon-close"></i>
        </button>
      </div>
    </div>

    <!-- Mobile/Tablet dropdown menu -->
    <div id="mobile-menu" class="lg:hidden border-t border-brand-100/40">
      <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col gap-1">
        <button class="nav-link text-left w-full active" id="mnav-inici"
          onclick="showView('inici');toggleMenu()">Inici</button>
        <button class="nav-link text-left w-full" id="mnav-pressupost"
          onclick="showView('pressupost');toggleMenu()">Pressupost</button>
        <button class="nav-link text-left w-full" id="mnav-metes"
          onclick="showView('metes');toggleMenu()">Metes</button>
        <button class="nav-link text-left w-full" id="mnav-dashboard"
          onclick="showView('dashboard');toggleMenu()">Dashboard</button>
        <button class="nav-link text-left w-full" id="mnav-historial"
          onclick="showView('historial');toggleMenu()">Historial</button>
        <button class="nav-link text-left w-full" id="mnav-comparador"
          onclick="showView('comparador');toggleMenu()">Comparador</button>
        <button class="nav-link text-left w-full" id="mnav-assessor"
          onclick="showView('assessor');toggleMenu()">Assessor IA</button>
        <button class="nav-link text-left w-full" id="mnav-compte"
          onclick="showView('compte');toggleMenu()">El meu Compte</button>
        <div class="flex gap-2 pt-2 pb-1" id="auth-mobile">
          <button onclick="showView('login');toggleMenu()"
            class="flex-1 font-display font-600 text-sm text-ink-muted border border-ink-muted/20 rounded-full py-2 hover:border-brand-400 transition-colors">Entrar</button>
          <button onclick="showView('register');toggleMenu()"
            class="flex-1 font-display font-700 text-sm text-white bg-brand-500 rounded-full py-2 hover:bg-brand-600 transition-colors">Registra't</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════════
       MAIN CONTENT — Les vistes es carreguen aquí
  ════════════════════════════════════════════════ -->
  <main class="pt-16 min-h-screen" id="main-content">
    <!-- Les vistes s'injecten dinàmicament per loadViews() -->
  </main>

  <!-- Global Toast -->
  <div id="global-toast" class="fixed bottom-5 right-5 z-50 hidden items-center gap-3 rounded-2xl border border-brand-200 bg-brand-50 px-5 py-4 shadow-lg transform transition-all translate-y-10 opacity-0">
    <i id="global-toast-icon" data-lucide="check-circle" class="w-5 h-5 text-brand-500 flex-shrink-0"></i>
    <p id="global-toast-msg" class="font-body text-sm font-500 text-brand-800"></p>
  </div>


  <!-- ══════════════════════════════════════════════
       FOOTER
  ════════════════════════════════════════════════ -->
  <footer class="border-t border-ink-muted/10 bg-white mt-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-lg bg-brand-500 flex items-center justify-center">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
            <path d="M3 12 L8 4 L13 12" stroke="white" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M5.5 9 h5" stroke="white" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </div>
        <span class="font-display font-700 text-sm text-ink">SmartPrice Comparator</span>
      </div>
      <p class="font-body text-xs text-ink-muted/50">Fet amb 💚 per a universitaris · Barcelona · 2025</p>
      <div class="flex gap-5">
        <a href="#" class="font-body text-xs text-ink-muted/50 hover:text-ink transition-colors">Privacitat</a>
        <a href="#" class="font-body text-xs text-ink-muted/50 hover:text-ink transition-colors">Termes</a>
        <a href="#" class="font-body text-xs text-ink-muted/50 hover:text-ink transition-colors">Contacte</a>
      </div>
    </div>
  </footer>


  <!-- ══════════════════════════════════════════════
       CÀRREGA DINÀMICA DE VISTES
  ════════════════════════════════════════════════ -->
  <script>
    // Carrega totes les vistes des dels arxius HTML externs i les injecta al main
    async function loadViews() {
      const viewFiles = ['inici', 'pressupost', 'metes', 'dashboard', 'comparador', 'assessor', 'login', 'register', 'historial', 'compte'];
      const main = document.getElementById('main-content');
      for (const view of viewFiles) {
        try {
          const res = await fetch(`views/${view}.html`);
          const html = await res.text();
          main.insertAdjacentHTML('beforeend', html);
        } catch (e) {
          console.error(`No s'ha pogut carregar la vista: ${view}`, e);
        }
      }
      // Un cop carregades totes les vistes, inicialitzem l'app
      if (window.lucide) lucide.createIcons();
      initDespesesPerDefecte();
      initComparador();
      await checkSession();
      carregarStatsPublics();
    }

    // Iniciem la càrrega de vistes quan el DOM estigui llest
    document.addEventListener('DOMContentLoaded', loadViews);
  </script>

  <!-- ══════════════════════════════════════════════
       BASE DE DADES (Supabase) + JAVASCRIPT PRINCIPAL
  ════════════════════════════════════════════════ -->
  <script src="js/database.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
